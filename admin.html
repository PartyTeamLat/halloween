<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Host list — Halloween</title>
    <meta name="theme-color" content="#1a0e16" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"><div class="moon"></div></div>
    <main class="card card-wide">
      <header class="admin-header">
        <div>
          <p class="eyebrow">Host list</p>
          <h1 id="admin-title">Halloween</h1>
        </div>
        <a class="text-link" href="index.html">Back to the invitation</a>
      </header>

      <p class="banner" id="demo-note" hidden></p>

      <section id="gate">
        <form id="login-form" class="stack">
          <div class="field">
            <label for="password">Host password</label>
            <input id="password" type="password" autocomplete="current-password" required />
            <p class="hint">This is the password in the Settings sheet, not a guest password.</p>
          </div>
          <p class="form-error" id="login-error" role="alert" hidden></p>
          <button class="button" type="submit">Open the list</button>
        </form>
      </section>

      <section id="board" hidden>
        <div class="toolbar">
          <p id="stats"></p>
          <div class="toolbar-actions">
            <button class="button button-quiet" id="refresh" type="button">Refresh</button>
            <button class="button button-quiet" id="download" type="button">Download</button>
            <button class="button button-quiet" id="sign-out" type="button">Sign out</button>
          </div>
        </div>
        <div class="meter" id="meter" hidden>
          <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
          <p id="meter-label"></p>
        </div>
        <p class="mail-line" id="mail-preview" hidden></p>
        <div class="filters" id="filters">
          <button class="chip is-selected" type="button" data-filter="pending">Asking</button>
          <button class="chip" type="button" data-filter="accepted">Accepted</button>
          <button class="chip" type="button" data-filter="paid">Paid</button>
          <button class="chip" type="button" data-filter="declined">Declined</button>
          <button class="chip" type="button" data-filter="all">All</button>
        </div>
        <p class="form-error" id="list-error" role="alert" hidden></p>
        <div id="guest-list"></div>
        <p class="quiet" id="empty-list" hidden>Nobody in this view.</p>
      </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
